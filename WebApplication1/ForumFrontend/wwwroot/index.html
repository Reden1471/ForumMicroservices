<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forum</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>📝 Forum</h1>
            <div id="user-info" style="display: none;">
                Üdv, <span id="current-user"></span>!
                <button onclick="logout()" class="btn-logout">Log out</button>
            </div>
        </header>

        <!-- Login page -->
        <div id="auth-section" class="auth-section">
            <div class="auth-container">
                <h2>Login</h2>
                <div class="form-group">
                    <input type="text" id="username" placeholder="Username" class="form-input">
                    <input type="password" id="password" placeholder="Password" class="form-input">
                    <button onclick="login()" class="btn-primary">Login</button>
                    <button onclick="showRegister()" class="btn-secondary">Register</button>
                </div>
            </div>

            <div id="register-container" class="auth-container" style="display: none;">
                <h2>Register</h2>
                <div class="form-group">
                    <input type="text" id="reg-username" placeholder="Username" class="form-input">
                    <input type="email" id="reg-email" placeholder="Email" class="form-input">
                    <input type="password" id="reg-password" placeholder="Password" class="form-input">
                    <button onclick="register()" class="btn-primary">Register</button>
                    <button onclick="showLogin()" class="btn-secondary">Back to login page</button>
                </div>
            </div>
        </div>

        <!-- Main content (after logging in) -->
        <div id="main-content" class="main-content" style="display: none;">
            <!-- Create new post -->
            <div class="create-post">
                <h3>New post</h3>
                <div class="form-group">
                    <input type="text" id="post-title" placeholder="Poszt címe" class="form-input">
                    <textarea id="post-content" placeholder="Poszt tartalma..." rows="4" class="form-textarea"></textarea>
                    <button onclick="createPost()" class="btn-primary">Submit post</button>
                </div>
            </div>

            <!-- List of Posts -->
            <div id="posts-container" class="posts-container">
                <h3>Newest posts</h3>
                <div id="posts-list"></div>
            </div>
        </div>

        <!-- Messages -->
        <div id="message" class="message"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
