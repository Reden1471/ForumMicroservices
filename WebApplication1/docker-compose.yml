version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "YourStrong!Password123"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

  apigateway:
    build:
      context: ../
      dockerfile: docker/ApiGateway.Dockerfile
    ports:
      - "7000:80"
    environment:
      - ASPNETCORE_URLS=http://+:80
      - Urls__UserService=http://userservice:80
      - Urls__AuthService=http://authservice:80
      - Urls__PostService=http://postservice:80
      - Urls__CommentService=http://commentservice:80
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=ForumMicroservices;User=sa;Password=YourStrong!Password123;TrustServerCertificate=true;
    depends_on:
      - sqlserver
      - authservice
      - postservice
      - commentservice
      - userservice

  authservice:
    build:
      context: ../
      dockerfile: docker/AuthService.Dockerfile
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=ForumMicroservices;User=sa;Password=YourStrong!Password123;TrustServerCertificate=true;
    depends_on:
      - sqlserver

  postservice:
    build:
      context: ../
      dockerfile: docker/PostService.Dockerfile
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=ForumMicroservices;User=sa;Password=YourStrong!Password123;TrustServerCertificate=true;
    depends_on:
      - sqlserver

  commentservice:
    build:
      context: ../
      dockerfile: docker/CommentService.Dockerfile
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=ForumMicroservices;User=sa;Password=YourStrong!Password123;TrustServerCertificate=true;
    depends_on:
      - sqlserver

  userservice:
    build:
      context: ../
      dockerfile: docker/UserService.Dockerfile
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=ForumMicroservices;User=sa;Password=YourStrong!Password123;TrustServerCertificate=true;
    depends_on:
      - sqlserver

  frontend:
    build:
      context: ../
      dockerfile: docker/ForumFrontend.Dockerfile
    ports:
      - "7006:80"
    environment:
      - ASPNETCORE_URLS=http://+:80

volumes:
  sqlserver_data: