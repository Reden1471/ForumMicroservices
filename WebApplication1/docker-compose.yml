version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "YourStrong!Password123"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

  apigateway:
    build:
      context: .
      dockerfile: ApiGateway.Dockerfile
    ports:
      - "7000:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - Urls__UserService=http://userservice:8080
      - Urls__AuthService=http://authservice:8080
      - Urls__PostService=http://postservice:8080
      - Urls__CommentService=http://commentservice:8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=ForumMicroservices;User=sa;Password=YourStrong!Password123;TrustServerCertificate=true;
    depends_on:
      - sqlserver
      - authservice
      - postservice
      - commentservice
      - userservice

  authservice:
    build:
      context: .
      dockerfile: AuthService.Dockerfile
    ports:
      - "7002:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=ForumMicroservices;User=sa;Password=YourStrong!Password123;TrustServerCertificate=true;
    depends_on:
      - sqlserver

  postservice:
    build:
      context: .
      dockerfile: PostService.Dockerfile
    ports:
      - "7003:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=ForumMicroservices;User=sa;Password=YourStrong!Password123;TrustServerCertificate=true;
    depends_on:
      - sqlserver

  commentservice:
    build:
      context: .
      dockerfile: CommentService.Dockerfile
    ports:
      - "7004:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=ForumMicroservices;User=sa;Password=YourStrong!Password123;TrustServerCertificate=true;
    depends_on:
      - sqlserver

  userservice:
    build:
      context: .
      dockerfile: UserService.Dockerfile
    ports:
      - "7001:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=ForumMicroservices;User=sa;Password=YourStrong!Password123;TrustServerCertificate=true;
    depends_on:
      - sqlserver

  frontend:
    build:
      context: .
      dockerfile: ForumFrontend.Dockerfile
    ports:
      - "7006:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080

volumes:
  sqlserver_data: